services:
  # Native Python Web Service Configuration
  - type: web
    name: student-placement-python
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13

  # Docker Web Service Configuration
  - type: web
    name: student-placement-docker
    env: docker
    envVars:
      - key: PORT
        value: 10000
